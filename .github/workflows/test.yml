name: Test
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby_version: ["3.2", "3.4"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          build-args: |
            RUBY_VERSION=${{ matrix.ruby_version }}
          tags: fast-xlsx:${{ matrix.ruby_version }}
          cache-from: type=gha,scope=ruby-${{ matrix.ruby_version }}
          cache-to: type=gha,scope=ruby-${{ matrix.ruby_version }},mode=max

      - name: Build native symbols
        run: |
          docker run --rm fast-xlsx:${{ matrix.ruby_version }} bundle exec rake build

      - name: Lint
        run: |
          docker run --rm fast-xlsx:${{ matrix.ruby_version }} bundle exec rubocop

      # Cada docker run sobe um container novo, sem a extensão compilada no passo anterior.
      # A task default compila antes de rodar os testes.
      - name: Unit tests
        run: |
          docker run --rm fast-xlsx:${{ matrix.ruby_version }} bundle exec rake

